name: Generate directory index

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directory-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate directory index outputs (JSON + ASCII + scripts list)
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python tools/generate_directory_index.py
          ls -la directory-index.json directory-tree.txt index list.txt

      - name: Commit and push directory index outputs
        shell: bash
        run: |
          set -euo pipefail

          git add directory-index.json directory-tree.txt index list.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update directory index outputs"
          git push
