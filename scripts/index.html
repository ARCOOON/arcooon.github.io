<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository Directory Index</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark light;
      }

      body {
        margin: 0;
        padding: 1.5rem;
        background: #050608;
        color: #f5f5f5;
      }

      .app-shell {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        margin: 0 0 1.5rem;
        color: #9ca3af;
        font-size: 0.9rem;
      }

      .card {
        border-radius: 0.75rem;
        border: 1px solid #1f2933;
        background: radial-gradient(circle at top left, #111827, #020617);
        padding: 1rem 1.25rem;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        font-size: 0.8rem;
        color: #9ca3af;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .pill {
        border-radius: 999px;
        border: 1px solid #374151;
        padding: 0.15rem 0.55rem;
        font-size: 0.75rem;
      }

      .search-input {
        flex: 1;
        max-width: 260px;
        padding: 0.35rem 0.55rem;
        border-radius: 999px;
        border: 1px solid #374151;
        background: #020617;
        color: inherit;
        font-size: 0.8rem;
      }

      .search-input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.4);
      }

      .tree {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .tree ul {
        list-style: none;
        padding-left: 1.1rem;
        margin: 0;
        border-left: 1px dashed #1f2937;
      }

      .tree-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.05rem 0;
      }

      .tree-item a {
        color: #e5e7eb;
        text-decoration: none;
      }

      .tree-item a:hover {
        text-decoration: underline;
      }

      .icon {
        width: 1rem;
        text-align: center;
        opacity: 0.7;
      }

      .dir > .tree-item a {
        color: #a5b4fc;
      }

      .file > .tree-item a {
        color: #e5e7eb;
      }

      .meta {
        margin-top: 0.75rem;
        font-size: 0.7rem;
        color: #6b7280;
      }

      .status {
        font-size: 0.8rem;
        color: #9ca3af;
        margin-top: 0.5rem;
      }

      .status.error {
        color: #f97373;
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .card {
          padding: 0.9rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <h1>Static Script Catalog</h1>
      <p class="subtitle">Live directory index sourced from <code>directory-index.json</code>.</p>

      <div class="card">
        <div class="toolbar">
          <div class="toolbar-left">
            <span class="pill">read-only view</span>
            <span>Generated via GitHub Actions</span>
          </div>
          <input
            id="search"
            class="search-input"
            type="search"
            placeholder="Filter paths e.g. 'scripts/docker'"
            autocomplete="off"
          />
        </div>

        <div id="status" class="status">Loading directory index...</div>
        <div id="tree-root" class="tree"></div>

        <div class="meta">
          <div>Source: <code>/directory-index.json</code></div>
          <div>Behavior: directories first, then files; sorted A-Z.</div>
        </div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const treeRootEl = document.getElementById("tree-root");
      const searchInput = document.getElementById("search");

      let fullTree = null;

      async function loadIndex() {
        try {
          const res = await fetch("directory-index.json", { cache: "no-store" });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          const data = await res.json();
          fullTree = data;
          renderTree(data);
          statusEl.textContent = "Directory index loaded.";
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Failed to load directory index. Ensure directory-index.json exists at repo root.";
          statusEl.classList.add("error");
        }
      }

      function renderTree(tree, filter = "") {
        treeRootEl.innerHTML = "";
        if (!tree || !Array.isArray(tree.children)) return;

        const normalizedFilter = filter.trim().toLowerCase();

        const rootUl = document.createElement("ul");

        const walk = (node, parentUl, parentPath = "") => {
          const isDirectory = node.type === "directory";
          const hasChildren = Array.isArray(node.children) && node.children.length > 0;
          const currentPath = node.path || parentPath;

          // Skip the very root node label, just render its children
          if (currentPath === "/" && !node.name) {
            if (hasChildren) {
              node.children.forEach((child) => walk(child, parentUl, "/"));
            }
            return;
          }

          const li = document.createElement("li");
          li.classList.add(isDirectory ? "dir" : "file");

          const itemRow = document.createElement("div");
          itemRow.className = "tree-item";

          const iconSpan = document.createElement("span");
          iconSpan.className = "icon";
          iconSpan.textContent = isDirectory ? "📁" : "📄";

          const link = document.createElement("a");
          const href = currentPath === "/" ? "/" : currentPath;
          link.href = href;
          link.textContent = node.name || "/";

          const pathSpan = document.createElement("span");
          pathSpan.style.opacity = "0.5";
          pathSpan.style.fontSize = "0.75rem";
          pathSpan.textContent = ` ${currentPath}`;

          itemRow.appendChild(iconSpan);
          itemRow.appendChild(link);
          itemRow.appendChild(pathSpan);
          li.appendChild(itemRow);

          if (hasChildren) {
            const childUl = document.createElement("ul");
            node.children.forEach((child) => walk(child, childUl, currentPath));
            li.appendChild(childUl);
          }

          // Filter handling: include node if its path matches or any descendant matches
          if (normalizedFilter) {
            const matchesSelf = currentPath.toLowerCase().includes(normalizedFilter);
            const matchesDescendant = hasChildren && node.children.some((child) =>
              subtreeHasMatch(child, normalizedFilter)
            );

            if (!matchesSelf && !matchesDescendant) {
              return;
            }
          }

          parentUl.appendChild(li);
        };

        const subtreeHasMatch = (node, filterValue) => {
          const nodePath = (node.path || "").toLowerCase();
          if (nodePath.includes(filterValue)) return true;
          if (!Array.isArray(node.children)) return false;
          return node.children.some((child) => subtreeHasMatch(child, filterValue));
        };

        tree.children.forEach((child) => walk(child, rootUl, "/"));
        treeRootEl.appendChild(rootUl);
      }

      searchInput.addEventListener("input", () => {
        if (!fullTree) return;
        const value = searchInput.value;
        renderTree(fullTree, value);
      });

      loadIndex();
    </script>
  </body>
</html>
